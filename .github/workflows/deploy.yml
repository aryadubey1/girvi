name: Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            cd /var/www/girvi
            git pull origin main

            cd backend
            npm install --production

            # Migrate production database
            npx node-pg-migrate up

            # Migrate sandbox database (same migrations, separate DB)
            DATABASE_URL="postgres://girvidb_user:girvi123@localhost:5432/girvi_db_sandbox" npx node-pg-migrate up

            # Explicitly ensure Chromium is installed, in case postinstall
            # scripts are blocked by npm's allow-scripts config on this VPS.
            npx puppeteer browsers install chrome

            pm2 restart girvi-backend

            cd ../frontend
            npm install
            npm run build
            pm2 restart girvi-frontend